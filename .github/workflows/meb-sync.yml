# ============================================================
# OtoNot — MEB kazanım senkronizasyonu (GitHub Actions)
# Programlar.aspx'deki envanteri yeniler ve tüm MEB-TYMM
# derslerinin öğrenme çıktılarını Supabase'e işler.
#
# Neden GitHub Actions?
#   MEB'de 535 ders PDF'i vardır; hepsini indirip parse etmek
#   Vercel'in tek request timeout'u (60s) içine sığmaz.
#   Bu workflow uzun çalışabilir (6 saate kadar) ve bedelsizdir.
#
# Ne zaman?
#   Varsayılan: her ayın 1'inde saat 03:00 (TR) — yani yılda 12 kez.
#   MEB genelde öğretim programlarını yaz aylarında yayımlar;
#   "senede 1" yeterliyse eğitim yılı başına (Eylül) denk gelmesi
#   için cron'u düzenleyebilirsin.
#
# Kurulum:
#   Repo -> Settings -> Secrets and variables -> Actions -> New secret
#   SUPABASE_URL=https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY=eyJ...  (secret anahtar)
# ============================================================
name: MEB Kazanım Senkronu
on:
  schedule:
    # Cron (UTC): "0 1 1 * *" = her ayın 1'i, 01:00 UTC = 04:00 TR
    - cron: "0 1 1 * *"
  workflow_dispatch: {}   # Manuel "Run workflow" butonu da mevcut

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kodu indir (checkout)
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm ci

      - name: MEB envanterini güncelle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-meb.js

      - name: Öğrenme çıktılarını Supabase'e işle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/collect-meb.js

      - name: Envanter değişimini commit et (varsa)
        run: |
          git config user.name "otonot-bot"
          git config user.email "dev@otonot.local"
          git add data/meb_programlar.json
          git commit -m "MEB envanter güncellemesi" || echo "değişiklik yok"
          git push || echo "push yok"